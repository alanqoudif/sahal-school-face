services:
  sahal:
    build: .
    # بيانات الكاميرا (CAMERA_*) تُقرأ من .env على السيرفر فقط
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      SAHAL_DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Dubai}
      SAHAL_TZ: ${SAHAL_TZ:-Asia/Dubai}
      SAHAL_ADMIN_PASSWORD: ${SAHAL_ADMIN_PASSWORD:-sahal}
      SAHAL_SECRET_KEY: ${SAHAL_SECRET_KEY:-}
    restart: unless-stopped

  backup:
    build: .
    depends_on:
      - sahal
    volumes:
      - ./data:/app/data
    environment:
      SAHAL_DATA_DIR: /app/data
      SAHAL_BACKUP_KEEP_DAYS: "30"
      SAHAL_BACKUP_INTERVAL_SECONDS: "86400"
      TZ: ${TZ:-Asia/Dubai}
      SAHAL_TZ: ${SAHAL_TZ:-Asia/Dubai}
    command: ["python", "-m", "app.backup", "--loop"]
    restart: unless-stopped
